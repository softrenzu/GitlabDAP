name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q rooomtech_dap
      - run: python -c "from rooomtech_dap.api import app; assert app.title == 'Rooomtech DAP'"
